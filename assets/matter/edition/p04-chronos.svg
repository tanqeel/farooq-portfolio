<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="bg-P04" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06070a" />
        <stop offset="60%" stop-color="#0b0e14" />
        <stop offset="100%" stop-color="#040507" />
      </linearGradient>
      <radialGradient id="glow-P04" cx="80%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#9fb5b7" stop-opacity="0.28" />
        <stop offset="80%" stop-color="#050506" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#bg-P04)" />
    <rect width="1600" height="900" fill="url(#glow-P04)" />

    <!-- Waveform / Data Curve Simulation -->
    <path d="M 0 550 Q 300 350, 600 520 T 1200 480 T 1600 380" fill="none" stroke="#9fb5b7" stroke-width="3" stroke-opacity="0.75" />
    <path d="M 0 550 Q 300 350, 600 520 T 1200 480 T 1600 380 L 1600 900 L 0 900 Z" fill="#9fb5b7" fill-opacity="0.04" />
    <path d="M 0 620 Q 400 480, 800 600 T 1600 500" fill="none" stroke="rgba(242,241,237,0.3)" stroke-width="1.5" stroke-dasharray="4 6" />

    <!-- Technical UI HUD Elements -->
    <g fill="none" stroke="rgba(242,241,237,0.12)" stroke-width="1">
      <rect x="80" y="80" width="1440" height="740" rx="4"/>
      <line x1="80" y1="160" x2="1520" y2="160"/>
      <line x1="1050" y1="160" x2="1050" y2="820"/>
    </g>

    <!-- Content Block -->
    <g font-family="monospace">
      <text x="120" y="130" font-size="13" fill="#9fb5b7" letter-spacing="3">P04 // FLAGSHIP ARCHITECTURE</text>
      <text x="1480" y="130" font-size="13" fill="rgba(242,241,237,0.6)" text-anchor="end" letter-spacing="2">BENCHMARK: 10M Events/sec</text>

      <text x="120" y="260" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="bold" fill="#f2f1ed">Chronos Stream</text>
      <text x="120" y="310" font-size="15" fill="#9fb5b7" letter-spacing="2">GLOBAL REAL-TIME OBSERVABILITY</text>
      
      <text x="120" y="370" font-size="18" fill="rgba(242,241,237,0.75)" font-family="'Space Grotesk', sans-serif">Real-time telemetry aggregation and anomaly detection with sub-second alert loop.</text>
    </g>

    <!-- Side Metrics Panel -->
    <g font-family="monospace" fill="rgba(242,241,237,0.7)" font-size="12" letter-spacing="1">
      <text x="1100" y="220" fill="#f2f1ed" font-size="15" font-weight="bold">SYSTEM METRICS</text>
      <text x="1100" y="270">THROUGHPUT: <tspan fill="#9fb5b7">2.4M QPS</tspan></text>
      <text x="1100" y="310">REPLICATION: <tspan fill="#f2f1ed">MULTI-REGION ACTIVE</tspan></text>
      <text x="1100" y="350">SECURITY: <tspan fill="#f2f1ed">mTLS + ENCLAVE ZERO-TRUST</tspan></text>
      <text x="1100" y="390">FAULT TOLERANCE: <tspan fill="#9fb5b7">BYZANTINE RESILIENT</tspan></text>
      <text x="1100" y="430">STACK: <tspan fill="#f2f1ed">Rust · Go · K8s · WebGL</tspan></text>

      <!-- Mini Chart -->
      <g stroke="#9fb5b7" stroke-width="1.5" fill="none">
        <polyline points="1100,560 1150,520 1200,540 1250,470 1300,510 1350,440 1400,430 1450,390" />
      </g>
      <text x="1100" y="590" font-size="10" fill="rgba(242,241,237,0.4)">TELEMETRY REACTION TIME (LAST 24H)</text>
    </g>

    <!-- Play Symbol Pill -->
    <g transform="translate(120, 680)">
      <rect width="210" height="52" rx="26" fill="rgba(242,241,237,0.08)" stroke="#9fb5b7" stroke-width="1.5"/>
      <circle cx="36" cy="26" r="14" fill="#9fb5b7"/>
      <polygon points="32,20 44,26 32,32" fill="#050506"/>
      <text x="64" y="31" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#f2f1ed" letter-spacing="1">INSPECT SYSTEM ▶</text>
    </g>
  </svg>