<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="ps-Aquila Spatial" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#050609" />
        <stop offset="50%" stop-color="#0a0e17" />
        <stop offset="100%" stop-color="#030406" />
      </linearGradient>
      <radialGradient id="ps-glow-Aquila Spatial" cx="50%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#9fb5b7" stop-opacity="0.32" />
        <stop offset="80%" stop-color="#050506" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="1448" height="1086" fill="url(#ps-Aquila Spatial)" />
    <rect width="1448" height="1086" fill="url(#ps-glow-Aquila Spatial)" />

    <!-- Window frame mock -->
    <g stroke="rgba(242,241,237,0.15)" stroke-width="1.5" fill="none">
      <rect x="70" y="70" width="1308" height="946" rx="14" fill="rgba(8,11,18,0.75)"/>
      <line x1="70" y1="140" x2="1378" y2="140"/>
    </g>

    <!-- Browser Dots -->
    <circle cx="110" cy="105" r="6" fill="#f87171" opacity="0.8"/>
    <circle cx="132" cy="105" r="6" fill="#fbbf24" opacity="0.8"/>
    <circle cx="154" cy="105" r="6" fill="#34d399" opacity="0.8"/>
    
    <text x="724" y="112" font-family="monospace" font-size="14" fill="rgba(242,241,237,0.5)" text-anchor="middle" letter-spacing="1">https://aquila spatial.platform.internal</text>

    <!-- Mock UI Elements -->
    <g transform="translate(130, 220)">
      <text font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="bold" fill="#f2f1ed">Aquila Spatial</text>
      <text y="46" font-family="monospace" font-size="15" fill="#9fb5b7" letter-spacing="2">WEBGPU 3D ENGINE</text>
      <text y="90" font-family="'Space Grotesk', sans-serif" font-size="22" fill="rgba(242,241,237,0.75)">Interactive spatial analytics with custom compute shaders</text>

      <!-- Dashboard mockup cards -->
      <g transform="translate(0, 150)" stroke="rgba(242,241,237,0.1)" stroke-width="1" fill="rgba(15,20,30,0.6)">
        <rect width="360" height="240" rx="8" />
        <rect x="400" width="360" height="240" rx="8" />
        <rect x="800" width="360" height="240" rx="8" />
      </g>
      
      <!-- Chart line in card 1 -->
      <path d="M 30 480 Q 100 420, 180 440 T 330 380" fill="none" stroke="#9fb5b7" stroke-width="3"/>
      <!-- Circular meter in card 2 -->
      <circle cx="580" cy="470" r="45" fill="none" stroke="rgba(242,241,237,0.2)" stroke-width="8"/>
      <circle cx="580" cy="470" r="45" fill="none" stroke="#f2f1ed" stroke-width="8" stroke-dasharray="180 280"/>
      <!-- Status lines in card 3 -->
      <line x1="830" y1="430" x2="1130" y2="430" stroke="rgba(242,241,237,0.2)" stroke-width="6" stroke-linecap="round"/>
      <line x1="830" y1="465" x2="1080" y2="465" stroke="#9fb5b7" stroke-width="6" stroke-linecap="round"/>
      <line x1="830" y1="500" x2="1000" y2="500" stroke="rgba(242,241,237,0.2)" stroke-width="6" stroke-linecap="round"/>
    </g>
  </svg>